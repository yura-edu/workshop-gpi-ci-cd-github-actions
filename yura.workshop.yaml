# yura.workshop.yaml — declarative grader config
# Spec: docs/grader-workers-spec.md §6
# Generated from prisma/seeds/workshop-templates.seed.ts

schema_version: "1.0"
workshop:
  id: gpi-ci-cd-github-actions
  title: "Pipeline CI/CD con GitHub Actions"
  type: configuration
  language: polyglot
  passing_threshold: 70
  base_branch: main
submission:
  source: workshop_link
  required_inputs:
    - type: github_repo_url
      label: "URL del repositorio"
      required: true
    - type: github_pr_url
      label: "URL del Pull Request"
      required: true
evaluation_profile:
  - metric_id: ci_pipeline_passes
    weight: 30
    threshold: 1
    config:
      provider: github_actions
      required_workflows: []
      mode: all_required_pass
      timeout_minutes_after_submit: 10
  - metric_id: ci_stages_present
    weight: 25
    threshold: 5
    config:
      target_file: .github/workflows/ci.yml
      required_stages:
        - lint
        - test
        - build
        - scan
        - deploy
      min_stages: 5
  - metric_id: config_file_valid_schema
    weight: 15
    threshold: 1
    config:
      target_file: .github/workflows/ci.yml
      schema_source: bundled
      schema_id: github-actions-workflow-1.0
      format: yaml
  - metric_id: ci_cache_configured
    weight: 10
    threshold: 1
    config:
      providers:
        - "actions/cache@v3"
        - "actions/cache@v4"
  - metric_id: test_coverage
    weight: 10
    threshold: 0.7
    config:
      runner: vitest
      coverage_tool: c8
      coverage_format: lcov
      report_path: coverage/lcov.info
      include_paths:
        - src/
      exclude_paths:
        - tests/
        - "**/__init__.py"
        - "**/*.spec.ts"
        - "**/*.test.ts"
      min_coverage_percent: 70
      min_coverage_per_file: 0
      timeout_seconds: 300
      extra_args: []
  - metric_id: commit_message_quality
    weight: 10
    threshold: 0.7
    config:
      pattern: "^(feat|fix|chore|docs|refactor|test|style|perf|ci|build)(\\(.+\\))?: .{10,}$"
      min_message_length: 10
      range: pr_only
      max_violations_allowed: 0
